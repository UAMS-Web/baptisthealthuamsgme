name: CI

# Calls the shared job chain in UAMS-Web/uams-ci-workflows and adds the one job a ruleset requires,
# `CI`. The chain's jobs run the Composer scripts this repository defines (`test:pint`,
# `test:refactor`, `stan`, `test:unit`). The reference after `uses:` is a release tag, never a
# branch, so a change to the shared chain reaches this repository only when the tag moves.
#
# `CI` needs the call and fails unless the call reports `success`: a skipped or cancelled call fails
# it. Keep `needs:` naming `checks`; renaming `CI` means changing the ruleset.
#
# The `checks` job carries the RUN_REMOTE_CI gate (`vars.RUN_REMOTE_CI != 'false'`), so setting the
# variable to `false` skips the chain and bills no minutes. This repository is public, where
# minutes are free and the variable is unset, so the chain runs on every pull request.
#
# Mutation is on (UAMS-Web/baptisthealthuamsgme#15). A pull request or push mutates the changed PHP
# files under `mutate-paths`; a manual run mutates the files the `composer mutate` script names. The
# `mutate-paths` entry names each first-party file under `includes` rather than the folder, because the
# folder also matches third-party `includes/vendors`, which the script leaves out and a change there would
# be selected on a pull request and fail. A new first-party file under `includes` is added to `mutate-paths`
# and to the `composer mutate` script. The `mutate-ignore` job audits annotations over `includes` and `tests`.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:
  # The mutate job mutates only the changed files on a pull request and on a push, and everything on a scheduled
  # or manual run, under the `mutate-full-timeout-minutes` input (default 180). The weekly run catches drift from
  # a dependency or tooling change that no pull request touches (UAMS-Web/baptisthealthuamsgme#16). A schedule
  # runs on the default branch, and GitHub disables it after 60 days without repository activity.
  schedule:
    - cron: '17 7 * * 1'

# A new push to a pull request cancels that pull request's stale run, so a pull request keeps
# one group. Every other run (a push to the default branch, a manual run) gets a group of its
# own, keyed on the commit, so a later push never cancels it. A shared push group would: GitHub
# keeps one running and one pending run per group and cancels the pending one when another is
# queued, whatever `cancel-in-progress` says, so a merge landing during a long run would cancel
# the previous merge's run before it started a job. Its commit would show a short, settled run
# and the chain would never have run on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.11.1
    if: vars.RUN_REMOTE_CI != 'false'
    with:
      linux-only: true
      mutate: true
      mutate-paths: functions.php front-page.php page_landing.php page_leadership.php page_news.php includes/class-search-form.php includes/enqueue-assets.php includes/footer-nav.php includes/google-fonts.php includes/suggested-plugins.php includes/theme-config.php includes/theme-license.php includes/widget-areas.php
      mutate-ignore: true
      mutate-ignore-paths: includes tests
      pest-command: composer test:unit
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      floor-lint-command: >-
        find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './.claude/*'
        -not -path './.agents/*' -not -path './.cursor/*' -not -path './includes/vendors/*'
        -print0 | xargs -0 -n1 php -l

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call.
  ci:
    name: CI
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
